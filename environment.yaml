name: nd_toxicology
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - numpy=1.21
  - pandas=1.3
  - matplotlib=3.4
  - seaborn=0.11
  - scipy=1.7
  - scikit-learn=1.0
  - biopython=1.79
  - networkx=2.6
  - requests=2.25
  - pyyaml=5.4
  - openpyxl=3.0
  - pip
  - pip:
    - matplotlib-venn
    - gseapy
    - gmx_MMPBSA  # requires external installation